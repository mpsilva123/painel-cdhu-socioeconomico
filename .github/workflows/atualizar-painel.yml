# Atualiza o painel a cada hora: busca as respostas no KoboToolbox,
# gera docs/data/data.json (anonimizado) e publica no Cloudflare Pages
# (mesmo modelo do painel da Enquete de IA).
name: Atualizar painel (Kobo → Cloudflare Pages)

on:
  schedule:
    - cron: "7 * * * *"      # a cada hora, no minuto 7 (UTC)
  workflow_dispatch:          # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CF_PROJECT: ${{ vars.CF_PROJECT || 'painel-cdhu-8ttkr893iu' }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'c0392c1543666a97b467ae3f952b7834' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados no Kobo e gerar data.json
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_SERVER: ${{ vars.KOBO_SERVER || 'https://kf.kobotoolbox.org' }}
          KOBO_ASSET_UID: ${{ vars.KOBO_ASSET_UID || 'azVZhQG6BNYi9hoJxM5BfK' }}
          SALARIO_MINIMO: ${{ vars.SALARIO_MINIMO || '1621' }}
        run: |
          if [ -z "$KOBO_TOKEN" ]; then
            echo "::warning::Secret KOBO_TOKEN não configurado — publicando o data.json já versionado."
          else
            python scripts/build_data.py --skip-geo
          fi

      - name: Baixar malha municipal de SP (IBGE)
        run: python -c "import sys; sys.path.insert(0,'scripts'); import build_data as b; b.ensure_geojson()" || echo "::warning::Malha do IBGE indisponível; o navegador tentará baixar direto."

      - name: Bloquear indexação por buscadores
        run: |
          printf 'User-agent: *\nDisallow: /\n' > docs/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  Cache-Control: no-cache\n  Referrer-Policy: no-referrer\n' > docs/_headers

      - name: Criar projeto no Cloudflare (só na primeira vez)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages project create ${{ env.CF_PROJECT }} --production-branch=main

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages deploy docs --project-name=${{ env.CF_PROJECT }} --branch=main --commit-dirty=true
